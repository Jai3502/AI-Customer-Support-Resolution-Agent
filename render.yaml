services:
  - type: web
    name: ai-customer-support-agent
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port 10000 --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GOOGLE_API_KEY
        sync: false
